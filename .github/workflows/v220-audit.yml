name: Motofy v2.2.0 Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint (diagnostic)
        continue-on-error: true
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: TypeScript (diagnostic)
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
