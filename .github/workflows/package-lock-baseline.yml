name: Package lock baseline

on:
  push:
    branches:
      - chore/package-lock-baseline
    paths:
      - .github/workflows/package-lock-baseline.yml
      - .npmrc
      - package.json
      - scripts/install-ci.sh
      - scripts/build-verified.sh
      - scripts/sites-env.sh

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Generate canonical lockfile using repo npm config
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify manifest was not changed
        run: git diff --exit-code -- package.json

      - name: Verify repo npm config
        run: |
          test "$(npm config get legacy-peer-deps)" = "true"
          node -e "const p=require('./package-lock.json'); console.log('lockfileVersion=' + p.lockfileVersion);"

      - name: Run wrapped Motofy install-ci pipeline
        run: bash scripts/sites-env.sh -- bash scripts/install-ci.sh

      - name: Unit tests
        run: npm run test:unit

      - name: Lint diagnostic
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Review generated lockfile
        shell: bash
        run: |
          test -f package-lock.json
          git status --short
          git diff --stat -- package-lock.json

      - name: Commit verified lockfile to temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: establish verified package lock baseline"
          git push

      - name: Report lint baseline
        shell: bash
        run: |
          echo "lint_outcome=${{ steps.lint.outcome }}"
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "Lockfile install/tests/build passed. Existing source lint debt remains and is not part of this lockfile commit."
          fi
