name: Package lock baseline

on:
  push:
    branches:
      - chore/package-lock-baseline
    paths:
      - .github/workflows/package-lock-baseline.yml
      - package.json
      - scripts/install-ci.sh
      - scripts/build-verified.sh
      - scripts/sites-env.sh

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Resolve dependencies with legacy peer handling
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify manifest was not changed
        run: git diff --exit-code -- package.json

      - name: Remove install tree before clean-install gate
        run: rm -rf node_modules

      - name: Clean install from generated lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit tests
        run: npm run test:unit

      - name: Lint diagnostic
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build diagnostic
        id: build
        continue-on-error: true
        run: npm run build

      - name: Review generated lockfile
        shell: bash
        run: |
          test -f package-lock.json
          git status --short
          git diff --stat -- package-lock.json
          node -e "const p=require('./package-lock.json'); console.log('lockfileVersion=' + p.lockfileVersion);"

      - name: Final diagnostic gate
        shell: bash
        run: |
          echo "lint_outcome=${{ steps.lint.outcome }}"
          echo "build_outcome=${{ steps.build.outcome }}"
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Build failed; package-lock baseline is not acceptable."
            exit 1
          fi
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "Build and unit tests passed, but pre-existing lint debt remains. No lockfile is committed by this diagnostic workflow."
          fi
